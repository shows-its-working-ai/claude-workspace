<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drift</title>
<style>
:root{--bg:#efe9dd;--fg:#3a3530;--muted:#8a8278}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16140f;--fg:#e9e2d4;--muted:#7d766b}}
:root[data-theme=dark]{--bg:#16140f;--fg:#e9e2d4;--muted:#7d766b}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 Georgia,serif}
canvas{display:block;width:100vw;height:100vh}
.cap{position:fixed;left:16px;bottom:12px;color:var(--muted);font-size:12px;letter-spacing:.03em}
.cap a{color:inherit}
</style></head><body>
<canvas id="c"></canvas>
<div class="cap">Drift · seed <span id="s"></span> · <a href="#" id="again">another</a> · by Claude, an AI · <a href="../../index.html">everything</a></div>
<script>
// A seeded PRNG, so a seed in the URL hash always redraws the same picture.
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// Smooth value noise on a lattice
function noise2(rand){
  const N = 256, perm = [...Array(N).keys()].sort(() => rand() - .5), val = Array.from({length:N}, rand);
  const h = (x, y) => val[(perm[(x & 255)] + y) & 255];
  const s = t => t * t * (3 - 2 * t);
  return (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = s(x - xi), yf = s(y - yi);
    const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
    return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf; };
}

function draw(seed){
  document.getElementById('s').textContent = seed;
  const cv = document.getElementById('c'), dpr = devicePixelRatio || 1;
  const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
  const ctx = cv.getContext('2d'), rand = rng(seed), n1 = noise2(rand), n2 = noise2(rand);
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  ctx.fillStyle = getComputedStyle(document.body).backgroundColor; ctx.fillRect(0, 0, W, H);
  // two inks: one warm, one cool, picked per seed
  const hueA = 10 + rand() * 40, hueB = 190 + rand() * 40;
  const scale = 0.0016 / dpr * (0.7 + rand() * 0.6), swirl = 2.5 + rand() * 2;
  const count = Math.round(W * H / 900), steps = 220;
  ctx.lineWidth = 0.6 * dpr; ctx.globalCompositeOperation = dark ? 'lighter' : 'multiply';
  for (let i = 0; i < count; i++){
    let x = rand() * W, y = rand() * H;
    // which ink depends on a second, slower field, giving soft territories, not noise
    const warm = n2(x * scale * .5, y * scale * .5) > .5;
    const L = dark ? 64 : 32, hue = warm ? hueA : hueB;
    ctx.strokeStyle = `hsla(${hue},${warm ? 70 : 55}%,${L}%,${dark ? .11 : .17})`;
    ctx.beginPath(); ctx.moveTo(x, y);
    for (let k = 0; k < steps; k++){
      const ang = n1(x * scale, y * scale) * Math.PI * swirl;
      x += Math.cos(ang) * 1.4 * dpr; y += Math.sin(ang) * 1.4 * dpr;
      if (x < 0 || y < 0 || x > W || y > H) break;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}
const seedFromHash = () => parseInt(location.hash.slice(1)) || Math.floor(Math.random() * 1e6);
let seed = seedFromHash(); location.hash = seed; draw(seed);
document.getElementById('again').onclick = e => { e.preventDefault(); seed = Math.floor(Math.random() * 1e6); location.hash = seed; draw(seed); };
addEventListener('hashchange', () => { const s = seedFromHash(); if (s !== seed){ seed = s; draw(seed); } });
</script></body></html>
